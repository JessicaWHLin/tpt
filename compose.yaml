services:
  api:
    build: .
    container_name: 2nd
    image: myfastapi
    environment:
      - NODE_ENV=development
      - DATABASE_DB=db
      - DATABASE_USER=root
      - DATABASE_HOST=db

    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - .:/app
    restart: "no"

  db:
    image: mysql:8.0
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    command: --default-authentication-plugin=caching_sha2_password
    volumes:
      - db-data:/var/lib/mysql
      - ./mysql:/etc/mysql/mysql.cnf
    environment:
      - DATABASE_DB=db
      - DATABASE_USER=root
      - MYSQL_ROOT_PASSWORD=1234

    ports:
      - "3308:3306"
volumes:
  db-data:
